# TrendRadar 主配置文件 - 2026年2月更新

# 新闻源配置
sources:
  # 国内主流
  - name: 微博热搜
    url: https://m.weibo.cn/api/container/getSecond?containerid=106003%26filter_type%3Drealtimehot
    enable: true
    
  - name: 知乎热榜
    url: https://www.zhihu.com/api/v3/feed/topstory/hot-lists/total?limit=50
    enable: true
    
  - name: 百度热搜
    url: https://top.baidu.com/board?tab=realtime
    enable: true
    
  - name: 36氪快讯
    url: https://36kr.com/pp/api/newsflash/posts?per_page=30
    enable: true
    
  - name: 虎嗅
    url: https://www.huxiu.com/v2_action/article_list
    enable: true
    
  - name: 澎湃新闻
    url: https://m.thepaper.cn/api/channel/25984?pageSize=30
    enable: true
    
  - name: 财新热点
    url: https://api.caixin.com/api/v1/hot_recommend
    enable: true
    
  - name: 华尔街见闻
    url: https://api.wallstreetcn.com/v2/roll?page=1&limit=30
    enable: true
    
  - name: IT之家
    url: https://api.ithome.com/json/news/list?page=1&pagesize=30
    enable: true
    
  - name: 机器之心
    url: https://api.jiqizhixin.com/v1/articles?page=1&limit=30
    enable: true
    
  - name: 钛媒体
    url: https://www.tmtpost.com/api/v1/articles?page=1&limit=30
    enable: true

# AI分析配置
ai_analysis:
  enable: true
  model: deepseek
  prompt_template: |
    请从以下新闻中筛选出与【黄金、人工智能、大模型、创业、一人公司、OPC、一级市场】高度相关的条目。
    每一条需包含：标题、来源、时间、核心摘要、产业影响。
    
# 推送配置
notification:
  enable: false  # 需要推送时改为true，并配置webhook
  webhook_url: ""

# 输出配置
output:
  format: html
  save_path: ./output
  max_news_per_source: 30
